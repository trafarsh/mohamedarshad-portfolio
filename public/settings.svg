<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9dce1"/>
      <stop offset="1" stop-color="#8e949c"/>
    </linearGradient>
    <linearGradient id="gear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f656d"/>
      <stop offset="1" stop-color="#2f3339"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bg)"/>
  <g transform="translate(64 64)" fill="url(#gear)">
    <g id="tooth">
      <rect x="-7" y="-46" width="14" height="18" rx="3"/>
    </g>
    <use href="#tooth" transform="rotate(30)"/>
    <use href="#tooth" transform="rotate(60)"/>
    <use href="#tooth" transform="rotate(90)"/>
    <use href="#tooth" transform="rotate(120)"/>
    <use href="#tooth" transform="rotate(150)"/>
    <use href="#tooth" transform="rotate(180)"/>
    <use href="#tooth" transform="rotate(210)"/>
    <use href="#tooth" transform="rotate(240)"/>
    <use href="#tooth" transform="rotate(270)"/>
    <use href="#tooth" transform="rotate(300)"/>
    <use href="#tooth" transform="rotate(330)"/>
    <circle r="33"/>
  </g>
  <circle cx="64" cy="64" r="15" fill="#c9ccd1"/>
  <circle cx="64" cy="64" r="8" fill="#6b7178"/>
</svg>
